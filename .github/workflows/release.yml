name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          file_assets: dist/**
          tag_name: ${{ github.ref_name }}
          # GITHUB_TOKEN is used for release creation; no secret setup required.
          # This workflow builds and releases the Gus CLI tool on tag pushes.
          # It does not publish to npm; only builds the distribution and creates
          # a GitHub release with the dist/ files as assets.